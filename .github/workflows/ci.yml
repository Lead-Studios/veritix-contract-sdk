name: CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Build, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Type Coverage
        run: npm run type-coverage

      - name: Test
        run: npm test -- --coverage --coverageThreshold='{"global":{"lines":80}}'

      - name: Changelog Validation
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}
          CHANGED_SRC=$(git diff --name-only "$BASE" "$HEAD" -- src/ | wc -l)
          CHANGED_CHANGELOG=$(git diff --name-only "$BASE" "$HEAD" -- CHANGELOG.md | wc -l)
          if [ "$CHANGED_SRC" -gt "0" ] && [ "$CHANGED_CHANGELOG" -eq "0" ]; then
            echo "::error::Please update CHANGELOG.md under [Unreleased] when modifying files in src/."
            exit 1
          fi

  sdk-compat:
    name: stellar-sdk ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ['12.3.0', 'latest']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install @stellar/stellar-sdk@${{ matrix.sdk }}
        run: npm install --no-save @stellar/stellar-sdk@${{ matrix.sdk }}

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test:unit
